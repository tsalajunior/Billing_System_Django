{% extends 'base.html'%}

{% load i18n %}
{% load static %}

{% block content %}
<br><br>

<h1 class="text-capitalize text-center mx-10 text-white mb-4">{% trans 'Register a new Customer' %}</h1>
<form method="POST" class="mr-5 ml-5 text-white">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="name">{% trans 'Name' %}</label>
            <input type="text" name="name" required id="name" placeholder="{% trans 'Enter customer name' %}" class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="email">{% trans 'Email' %}</label>
            <input type="email" name="email" required id="email" placeholder="{% trans 'Enter customer email' %}"
                class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="phone">{% trans 'Phone' %}</label>
            <input type="text" name="phone" required id="phone" placeholder="{% trans 'Enter customer phone' %}" class="form-control">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="sex">{% trans 'Sex' %}</label>
            <select name="sex" required id="sex" class="form-control">
                <option value="">{% trans 'Choose the gender' %}</option>
                <option value="M">{% trans 'Male' %}</option>
                <option value="F">{% trans 'Female' %}</option>
            </select>
        </div>
        <div class="form-group col-md-6">
            <label for="age">{% trans 'Age' %}</label>
            <select name="age" required id="age" class="form-control">
                <option value="">{% trans 'Choose the range' %}</option>
                <option value="1">{% trans '0-15' %}</option>
                <option value="11">{% trans '16-20' %}</option>
                <option value="21">{% trans '21-30' %}</option>
                <option value="31">{% trans '31-40' %}</option>
                <option value="41">{% trans '41-50' %}</option>
                <option value="51">{% trans '51+' %}</option>
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-4">
            <label for="address">{% trans 'Address' %}</label>
            <input type="text" name="address" required id="address" placeholder="{% trans 'Enter customer address' %}"
                class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="city">{% trans 'City' %}</label>
            <input type="text" name="city" required id="city" placeholder="{% trans 'Enter customer city' %}" class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="zip_code">{% trans 'Zip Code' %}</label>
            <input type="text" name="zip_code" required id="zip_code" placeholder="{% trans 'Enter customer zip code' %}"
                class="form-control">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">{% trans 'Save' %}</button>
</form>
{% endblock %}
