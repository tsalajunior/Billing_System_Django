{% extends 'base.html'%}

{% load static %}

{% block content %}
<br><br>

<h1 class="text-capitalize text-center mx-10 text-white mb-4">Register a new Customer</h1>
<form method="POST" class="mr-5 ml-5 text-white">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="name">Name</label>
            <input type="text" name="name" required id="name" placeholder="Enter customer name" class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="email">Email</label>
            <input type="email" name="email" required id="email" placeholder="Enter customer email"
                class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="phone">Phone</label>
            <input type="text" name="phone" required id="phone" placeholder="Enter customer phone" class="form-control">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="sex">Sex</label>
            <select name="sex" required id="sex" class="form-control">
                <option value="">Choose the gender</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>
        </div>
        <div class="form-group col-md-6">
            <label for="age">Age</label>
            <select name="age" required id="age" class="form-control">
                <option value="">Choose the range</option>
                <option value="1">0-15</option>
                <option value="11">16-20</option>
                <option value="21">21-30</option>
                <option value="31">31-40</option>
                <option value="41">41-50</option>
                <option value="51">51+</option>
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-4">
            <label for="address">Address</label>
            <input type="text" name="address" required id="address" placeholder="Enter customer address"
                class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="city">City</label>
            <input type="text" name="city" required id="city" placeholder="Enter customer city" class="form-control">
        </div>
        <div class="form-group col-md-4">
            <label for="zip_code">Zip Code</label>
            <input type="text" name="zip_code" required id="zip_code" placeholder="Enter customer zip code"
                class="form-control">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
